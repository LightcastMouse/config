# Difftastic color config (local fork feature — see ~/d/difftastic).
#
# Synthesized from earlier requests in this session:
#   - "higher contrast and/or brighter colors" for added/removed lines
#     -> using hex/truecolor instead of ANSI "bright" names, since ANSI
#        bright red/green get muted by some terminal palettes (the
#        original complaint), while hex bypasses the terminal theme
#        entirely and always renders at full saturation.
#   - confusion that string literals showed up purple instead of red/green
#     -> reassigned purple to `keyword` (a more conventional mapping,
#        e.g. Atom One Dark/Monokai use purple for keywords), and gave
#        string literals a warm amber/gold instead so it reads clearly
#        as "syntax highlighting", not "part of the diff".
#   - "the entire length of changed lines should be tinted red/green,
#     like delta/VSCode, but keep syntax-highlighted text colors -
#     don't force red/green text"
#     -> `added`/`removed` are the emphasis style for the exact changed
#        characters (delta's plus-emph-style/minus-emph-style):
#        background only, `color = "none"` so syntax highlighting
#        (keyword purple, string amber, etc.) still shows through.
#     -> `added_line`/`removed_line` are a dimmer background applied to
#        the rest of a changed line (delta's plus-style/minus-style),
#        including whitespace gaps and padding, so the whole line reads
#        as one continuous tinted block.
#
# A role can be:
#   role = "colorname"                      (just a color)
#   role = "#rrggbb"                        (hex color)
#   role = { color = "...", background = "...", bold = true, italic = true, underline = true }
# `color`/`background` also accept "none" to explicitly clear a built-in
# default (e.g. so `added`/`removed` don't override syntax-highlight text).

[dark]
removed_line   = { background = "#4a000e" }
removed        = { color = "none", background = "#d40027" }
added_line     = { background = "#0e3300" }
added          = { color = "none", background = "#258c00" }
string_literal = { color = "#d4fe7f" }               # Zed Ayu Mirage: syntax.string
comment        = { color = "#5c6773", italic = true } # Zed Ayu Mirage: syntax.comment
keyword        = { color = "#ffad65", bold = true }   # Zed Ayu Mirage: syntax.keyword
type           = { color = "#73cfff", bold = true }   # Zed Ayu Mirage: syntax.type
error          = { color = "#f18779", bold = true }   # Zed Ayu Mirage: status.error

