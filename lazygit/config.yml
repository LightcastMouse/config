keybinding:
  universal:
    pushFiles: '<disabled>'

customCommands:
  - key: 'P'
    context: 'global'
    description: 'Push current branch to a selected remote'
    prompts:
      - type: 'menuFromCommand'
        title: 'Push current branch to remote'
        key: 'Remote'
        command: 'git remote'
        filter: '^(?P<name>.+)$'
        valueFormat: '{{ .name }}'
        labelFormat: '{{ .name }}'
    command: 'git push {{.Form.Remote}} HEAD:refs/heads/$(git branch --show-current)'
    loadingText: 'Pushing to {{.Form.Remote}}'
    output: 'log'
